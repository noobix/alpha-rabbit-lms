version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: testing-main
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    target-branch: testing-main
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
