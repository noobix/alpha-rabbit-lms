name: Minor Release
on:
  workflow_dispatch: {}
  pull_request:
    types: [closed]
    branches: [testing-main]

jobs:
  minor_release:
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node & pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Authenticate gh CLI
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          gh auth login --with-token <<< "${GITHUB_TOKEN}"

      - name: Run aggregation script (build annotated tag body)
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./scripts/release-aggregate.sh
          ./scripts/release-aggregate.sh

      - name: Check GPG secret availability
        id: gpg_check
        env:
          GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_KEY" ]; then
            echo "has_gpg=true" >> $GITHUB_OUTPUT
          else
            echo "has_gpg=false" >> $GITHUB_OUTPUT
          fi

      - name: Import GPG key (for signed tags)
        if: steps.gpg_check.outputs.has_gpg == 'true'
        uses: crazy-max/ghaction-import-gpg@v4
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Configure GPG signing (optional)
        if: steps.gpg_check.outputs.has_gpg == 'true'
        run: |
          if [ -n "${{ secrets.GPG_KEY_ID }}" ]; then
            git config user.signingkey "${{ secrets.GPG_KEY_ID }}"
          fi
          git config commit.gpgsign true

      - name: Compute new version
        id: version
        run: |
          if [ -f package.json ]; then
            CURRENT=$(jq -r '.version' package.json)
          else
            CURRENT="0.0.0"
          fi
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          NEW_MINOR=$((MINOR + 1))
          NEW_VERSION="$MAJOR.$NEW_MINOR.0"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Create annotated (and optionally signed) tag and push
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
          HAS_GPG: ${{ steps.gpg_check.outputs.has_gpg }}
        run: |
          TAG_MSG_FILE=sprint-tag-body.txt
          if [ ! -f "$TAG_MSG_FILE" ]; then
            echo "No sprint-tag-body.txt found; aborting"; exit 1;
          fi
          git config user.name "CI Bot"
          git config user.email "ci@alpharabbit.dev"
          if [ "$HAS_GPG" = "true" ]; then
            echo "Creating signed tag v${NEW_VERSION}"
            git tag -s "v${NEW_VERSION}" -F "$TAG_MSG_FILE"
          else
            echo "Creating annotated tag v${NEW_VERSION}"
            git tag -a "v${NEW_VERSION}" -F "$TAG_MSG_FILE"
          fi
          # use PAT to push the tag back
          if [ -n "$RELEASE_PAT" ]; then
            git remote set-url origin https://x-access-token:${RELEASE_PAT}@github.com/${{ github.repository }}
          fi
          git push origin "v${NEW_VERSION}"

      - name: Update .build_counter (increment)
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          if [ -f .build_counter ]; then
            CUR=$(cat .build_counter)
            NEXT=$((CUR + 1))
            echo $NEXT > .build_counter
            git add .build_counter
            git commit -m "chore: increment build counter to ${NEXT}" || echo "no changes"
            if [ -n "$RELEASE_PAT" ]; then
              git remote set-url origin https://x-access-token:${RELEASE_PAT}@github.com/${{ github.repository }}
            fi
            git push origin testing-main || echo "push failed"
          else
            echo "No .build_counter file present; skipping"
          fi

      - name: Optionally update package.json version
        if: ${{ always() }}
        run: |
          if [ -f package.json ]; then
            NEW=${{ steps.version.outputs.new_version }}
            npm pkg set version "$NEW"
            git add package.json
            git commit -m "chore(release): bump version to ${NEW}" || echo "no changes"
            if [ -n "${{ secrets.RELEASE_PAT }}" ]; then
              git remote set-url origin https://x-access-token:${{ secrets.RELEASE_PAT }}@github.com/${{ github.repository }}
            fi
            git push origin testing-main || echo "push failed"
          else
            echo "package.json not present; skipping"
          fi
