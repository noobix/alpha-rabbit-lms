name: Deploy on Tag
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node & pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build || echo "No build script; replace with your app build command"

      - name: Create GitHub Release and upload artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF##refs/tags/}
          BODY_FILE=sprint-tag-body.txt
          if [ ! -f "$BODY_FILE" ]; then
            echo "No sprint-tag-body.txt present; creating minimal body";
            echo "Release $TAG" > release-body.txt
            BODY_FILE=release-body.txt
          fi
          gh auth login --with-token <<< "${GITHUB_TOKEN}"
          gh release create "$TAG" --notes-file "$BODY_FILE" || gh release view "$TAG"
          # Upload any files in dist/ or out/; adjust path as your build outputs
          if [ -d dist ]; then
            for f in dist/*; do gh release upload "$TAG" "$f" || true; done
          fi
          if [ -d out ]; then
            for f in out/*; do gh release upload "$TAG" "$f" || true; done
