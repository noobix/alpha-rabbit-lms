name: Enable Branch Protection

on:
  workflow_dispatch:
    inputs:
      branches:
        description: 'Comma-separated branches to protect'
        required: false
        default: 'main,testing-main'

permissions:
  contents: read
  administration: write

jobs:
  protect:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare
        run: |
          echo "Setting up branch protection for repository: $GITHUB_REPOSITORY"

      - name: Enable protection via REST API
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCHES: ${{ github.event.inputs.branches }}
        run: |
          IFS=',' read -ra B <<< "$BRANCHES"
          for br in "${B[@]}"; do
            br_trim=$(echo "$br" | xargs)
            echo "Protecting branch: $br_trim"
            curl -s -X PUT \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $TOKEN" \
              https://api.github.com/repos/$REPO/branches/$br_trim/protection \
              -d '{
                "required_status_checks": {
                  "strict": true,
                  "contexts": ["CI"]
                },
                "enforce_admins": true,
                "required_pull_request_reviews": {
                  "dismiss_stale_reviews": true,
                  "require_code_owner_reviews": false,
                  "required_approving_review_count": 1
                },
                "restrictions": null
              }'
          done
