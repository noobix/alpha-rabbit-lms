# Author: Kelvin Kabute
# Last-updated: 2026-05-03

# Owner Merge workflow — lets the sole owner merge PRs without a second reviewer.
# Requires a repo secret named ADMIN_TOKEN (PAT with repo + admin:repo_hook scopes).
# The --admin flag on `gh pr merge` bypasses all branch-protection requirements
# (required reviews, required status checks, up-to-date branch) for admin tokens.
#
# Usage: Actions tab → "Owner Merge PRs" → Run workflow (select any branch that
# has this file) → enter comma-separated PR numbers → Run workflow.

name: Owner Merge PRs

on:
  workflow_dispatch:
    inputs:
      pr_numbers:
        description: "Comma-separated PR numbers to merge in order (e.g. 6,7,8)"
        required: true
        default: ""

permissions:
  contents: read

jobs:
  merge:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ADMIN_TOKEN }}

      - name: Merge PRs as admin (in order)
        env:
          PR_NUMBERS: ${{ github.event.inputs.pr_numbers }}
        run: |
          IFS=',' read -ra PRS <<< "$PR_NUMBERS"
          for pr in "${PRS[@]}"; do
            pr_trim=$(echo "$pr" | xargs)
            echo "=== Processing PR #$pr_trim ==="

            # Check if PR is already merged or closed
            state=$(gh pr view "$pr_trim" --repo "$REPO" --json state --jq '.state' 2>/dev/null || echo "UNKNOWN")
            if [ "$state" = "UNKNOWN" ]; then
              echo "ERROR: PR #$pr_trim not found or inaccessible. Check the PR number and ADMIN_TOKEN permissions."
              exit 1
            fi
            if [ "$state" = "MERGED" ] || [ "$state" = "CLOSED" ]; then
              echo "PR #$pr_trim is already $state — skipping."
              continue
            fi

            # Attempt to update the branch to the latest base before merging
            echo "Updating PR #$pr_trim branch to latest base..."
            gh pr update-branch "$pr_trim" --repo "$REPO" 2>/dev/null \
              && echo "Branch updated." \
              || echo "Branch update skipped (already up-to-date or not needed)."

            # Merge using --admin to bypass all branch-protection requirements
            echo "Merging PR #$pr_trim..."
            if ! gh pr merge "$pr_trim" \
              --repo "$REPO" \
              --merge \
              --admin \
              --subject "Merge PR #$pr_trim (owner merge)"; then
              echo "ERROR: PR #$pr_trim could not be merged. Check for unresolvable conflicts."
              exit 1
            fi
            echo "PR #$pr_trim merged successfully."
          done
