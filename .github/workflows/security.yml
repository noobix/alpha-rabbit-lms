name: Security

on:
  push:
    branches: [main, testing-main]
  pull_request:
    branches: [main, testing-main]
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  detect:
    name: Detect stack
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      node: ${{ steps.stack.outputs.node }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: stack
        run: |
          if [ -f package.json ]; then
            echo "node=true" >> "$GITHUB_OUTPUT"
          else
            echo "node=false" >> "$GITHUB_OUTPUT"
          fi

  codeql:
    name: CodeQL (${{ matrix.language }})
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: /language:${{ matrix.language }}

  codeql-node:
    name: CodeQL (javascript-typescript)
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: /language:javascript-typescript

  python-security:
    name: Python dependency and code audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install bandit==1.9.4 pip-audit==2.10.1
      - name: Static analysis (medium severity and above)
        run: bandit -r scripts -ll
      - name: Known vulnerabilities in pinned requirements
        run: pip-audit -r requirements.txt

  node-security:
    name: Node dependency audit
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@cc4f6536e38d1126c5e3b0683d469a14f23bfea4 # v3
        with:
          fail-on-severity: high

  codeql-gate:
    name: CodeQL alert gate
    needs: [codeql, codeql-node]
    if: always() && (needs.codeql.result == 'success' || needs.codeql.result == 'skipped') && (needs.codeql-node.result == 'success' || needs.codeql-node.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      security-events: read
      contents: read
    steps:
      - name: Check for high/critical CodeQL alerts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ github.ref }}
        run: |
          ALERTS=$(gh api "repos/${{ github.repository }}/code-scanning/alerts?ref=$REF&state=open&severity=high,critical" --jq '. | length')
          if [ "$ALERTS" -gt 0 ]; then
            echo "::error::$ALERTS open high/critical CodeQL alert(s) on $REF"
            exit 1
          fi

  security-gate:
    name: Security Gate
    if: always()
    needs:
      [
        detect,
        codeql,
        codeql-node,
        codeql-gate,
        python-security,
        node-security,
        secrets,
        dependency-review,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every blocking job to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e '[to_entries[] | select(.key | IN("codeql-node", "node-security", "dependency-review") | not) | .value.result] | all(. == "success")' > /dev/null
          echo "$NEEDS" | jq -e '[to_entries[] | select(.key | IN("codeql-node", "node-security", "dependency-review")) | .value.result] | all(. == "success" or . == "skipped")' > /dev/null
